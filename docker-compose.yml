services:
  t-ebank-discovery-service:
    build: ./discovery-service
    container_name: t-ebank-discovery-service
    ports:
      - '8761:8761'
    expose:
      - '8761'
    healthcheck:
      test: ["CMD","curl","-f","http://localhost:8761/actuator/health"]
      interval: 10s
      retries: 4

  t-ebank-config-service:
    build: ./config-service
    container_name: t-ebank-config-service
    ports:
      - '9999:9999'
    expose:
      - '9999'
    environment:
      - DISCOVERY_SERVICE_URL=http://t-ebank-discovery-service:8761/eureka
    healthcheck:
      test: [ "CMD","curl","-f","http://localhost:9999/actuator/health" ]
      interval: 10s
      retries: 4

    depends_on:
      t-ebank-discovery-service:
        condition: service_healthy

  postgres-customer:
    image: postgres:17
    environment:
      POSTGRES_DB: customer_database2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definis POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - customer-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h localhost -U postgres -d customer_database2" ]
      interval: 10s
      retries: 4

  postgres-account:
    image: postgres:17
    environment:
      POSTGRES_DB: Bank_Account
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definis POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:15434:5432"
    volumes:
      - account-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h localhost -U postgres -d Bank_Account" ]
      interval: 10s
      retries: 4


  t-ebank-customer-service2:
    build: ./Customer-service2
    container_name: t-ebank-customer-service2
    ports:
      - '8083:8083'
    expose:
      - '8083'
    environment:
       SERVER_PORT: "8083"
       SPRING_APPLICATION_NAME: customer-service2
       DISCOVERY_SERVICE_URL: http://t-ebank-discovery-service:8761/eureka
       CONFIG_SERVICE_URL: http://t-ebank-config-service:9999
       SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-customer:5432/customer_database2
       SPRING_DATASOURCE_USERNAME: postgres
       SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Definis POSTGRES_PASSWORD}


    healthcheck:
      test: [ "CMD","curl","-f","http://localhost:8083/actuator/health" ]
      interval: 10s
      retries: 6
      start_period: 90s
    depends_on:
       t-ebank-config-service:
         condition: service_healthy
       postgres-customer:
         condition: service_healthy

  t-ebank-account-service:
    build: ./account-service
    container_name: t-ebank-account-service
    ports:
      - '8082:8082'
    expose:
      - '8082'
    environment:
       SERVER_PORT: "8082"
       SPRING_APPLICATION_NAME: account-service
       DISCOVERY_SERVICE_URL: http://t-ebank-discovery-service:8761/eureka
       CONFIG_SERVICE_URL: http://t-ebank-config-service:9999
       SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-account:5432/Bank_Account
       SPRING_DATASOURCE_USERNAME: postgres
       SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Definis POSTGRES_PASSWORD}


    healthcheck:
      test: [ "CMD","curl","-f","http://localhost:8082/actuator/health" ]
      interval: 10s
      retries: 4

    depends_on:
      t-ebank-customer-service2:
        condition: service_healthy
      postgres-account:
        condition: service_healthy

  t-ebank-gateway-service:
    build: ./gateway-service
    container_name: t-ebank-gateway-service
    ports:
      - '8888:8888'
    expose:
      - '8888'
    environment:
      - DISCOVERY_SERVICE_URL=http://t-ebank-discovery-service:8761/eureka
      - CONFIG_SERVICE_URL=http://t-ebank-config-service:9999

    depends_on:
      t-ebank-config-service:
        condition: service_healthy

volumes:
  customer-data:
  account-data: