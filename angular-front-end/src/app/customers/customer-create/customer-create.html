<div class="container py-4">
  <div class="card shadow-sm mx-auto" style="max-width: 600px">
    <div class="card-body p-4">
      <h2 class="h4 mb-4">Create a new Customer</h2>

      <form
        #customerForm="ngForm"
        (ngSubmit)="customerForm.valid && customeradd()">
        <div class="mb-3">
          <label for="firstname" class="form-label">Firstname</label>
          <input
            id="firstname"
            name="firstname"
            type="text"
            class="form-control"
            [(ngModel)]="customerCreate1.firstname"
            required
          />
        </div>
        <div class="mb-3">
          <label for="lastname" class="form-label">Nom</label>
          <input
            id="lastname"
            name="lastname"
            type="text"
            class="form-control"
            [(ngModel)]="customerCreate1.lastname"
            required
          />
        </div>
        <div class="mb-4">
          <label for="email" class="form-label">E-mail</label>
          <input
            id="email"
            name="email"
            type="email"
            class="form-control"
            [(ngModel)]="customerCreate1.email"
            required
            email
          />
        </div>
        <button
          type="submit"
          class="btn btn-primary w-100"
          [disabled]="customerForm.invalid"
        >
          <i class="bi bi-floppy me-2"></i>
          Save
        </button>
      </form>

    </div>
  </div>

</div>
