spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: r1
              uri: http://localhost:8083/
              predicates:
                - Path=/Customers/**
            - id: r2
              uri: http://localhost:8082/
              predicates:
                - Path=/bankAccount/**
  application:
    name: gateway-service
server:
  port: 8888